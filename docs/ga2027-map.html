<!-- GA 2027 Area Map: paste into a Squarespace Code block -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  #gaMap {
    height: clamp(560px, 80vh, 900px);
    width: 100%;
    border-radius: 6px;
  }
  .ga-pin {
    display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border-radius: 50%;
    font: 700 13px/1 Arial, Helvetica, sans-serif;
    border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.45);
  }
  .ga-pin.parking   { background: #ffe500; color: #222; }
  .ga-pin.hotel     { background: #3f7a35; color: #fff; }
  .ga-pin.transport { background: #14284b; color: #fff; font-size: 10px; }
  .ga-pin.venue     { background: #1f4fa0; color: #fff; width: 34px; height: 34px; font-size: 11px; }
  .ga-pin.warning   { background: #c62828; color: #fff; font-size: 15px; }
  /* Keep map text dark even when the Squarespace section uses light text */
  #gaMap .ga-legend,
  #gaMap .leaflet-popup-content,
  #gaMap .leaflet-control-layers { color: #222; }
  .ga-popup b { font-size: 14px; }
  .ga-popup .note { color: #555; font-style: italic; }
  .ga-legend {
    background: #fff; padding: 8px 10px; border-radius: 4px;
    font: 12px/1.5 Arial, Helvetica, sans-serif;
    box-shadow: 0 1px 4px rgba(0,0,0,.3);
  }
</style>

<div id="gaMap"></div>

<script>
(function () {
  // Set to false before going live. While true, clicking the map shows coordinates.
  const SHOW_COORDS = true;

  // ⚠ All coordinates are APPROXIMATE, estimated from the PDF. Verify each one.
  const places = [
    // Parking (* = volunteer pass lot)
    { type: 'parking', label: 'A', name: 'Baird Center Garage', price: '$$$', volunteer: true,  lat: 43.0410, lng: -87.9168 },
    { type: 'parking', label: 'B', name: '6th & State Lot',     price: '$$',  volunteer: true,  lat: 43.0428, lng: -87.9200 },
    { type: 'parking', label: 'C', name: '332 State Lot',       price: '$$',  volunteer: true,  lat: 43.0435, lng: -87.9150 },
    { type: 'parking', label: 'D', name: 'Symphony (MSO) Lot',  price: '$$$', volunteer: true,  lat: 43.0400, lng: -87.9137 },
    { type: 'parking', label: 'E', name: '3rd & Wells Lot',     price: '$$$', volunteer: true,  lat: 43.0408, lng: -87.9147 },
    { type: 'parking', label: 'F', name: '401 W Wisconsin Ave', price: '$$',  volunteer: false, lat: 43.0383, lng: -87.9162,
      note: 'Access from Vel R Phillips Ave' },

    // Hotels
    { type: 'hotel', label: '1', name: 'Hilton',                      lat: 43.0385, lng: -87.9175 },
    { type: 'hotel', label: '2', name: 'The Marc',                    lat: 43.0384, lng: -87.9185 },
    { type: 'hotel', label: '3', name: 'DoubleTree',                  lat: 43.0387, lng: -87.9195 },
    { type: 'hotel', label: '4', name: 'SpringHill Suites (Marriott)', lat: 43.0400, lng: -87.9150 },
    { type: 'hotel', label: '5', name: 'Hyatt Regency',               lat: 43.0413, lng: -87.9148 },
    { type: 'hotel', label: '6', name: 'Fairfield (Marriott)',        lat: 43.0392, lng: -87.9135 },
    { type: 'hotel', label: '7', name: 'Courtyard (Marriott)',        lat: 43.0378, lng: -87.9137 },
    { type: 'hotel', label: '8', name: 'Hampton Inn',                 lat: 43.0392, lng: -87.9117 },

    // Transportation
    { type: 'transport', label: 'Tr', name: 'Amtrak Station',             lat: 43.0346, lng: -87.9170 },
    { type: 'transport', label: 'Ld', name: 'Loading Dock (Baird Center)', lat: 43.0410, lng: -87.9190 },

    // Venue and warnings
    { type: 'venue',   label: 'GA', name: 'Baird Center', lat: 43.0397, lng: -87.9172 },
    { type: 'warning', label: '⛔', name: 'No left turn',  lat: 43.0389, lng: -87.9143,
      note: 'Eastbound Wisconsin Ave cannot turn left onto Dr. MLK Jr. Dr.' }
  ];

  // Add links later, e.g. links: [{ text: 'Pre-pay', url: 'https://...' }]
  function popupHtml(p) {
    let html = '<div class="ga-popup"><b>' + p.name + '</b>';
    if (p.price) html += '<br>Price: ' + p.price;
    if (p.volunteer) html += '<br>Volunteer pass lot';
    if (p.note) html += '<br><span class="note">' + p.note + '</span>';
    (p.links || []).forEach(function (l) {
      html += '<br><a href="' + l.url + '" target="_blank" rel="noopener">' + l.text + '</a>';
    });
    return html + '</div>';
  }

  const map = L.map('gaMap', { scrollWheelZoom: false }).setView([43.0395, -87.9160], 16);

  L.tileLayer('https://tiles.stadiamaps.com/tiles/alidade_smooth/{z}/{x}/{y}{r}.png', {
    maxZoom: 20,
    attribution: '&copy; <a href="https://stadiamaps.com/">Stadia Maps</a> &copy; <a href="https://openmaptiles.org/">OpenMapTiles</a> &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  const groups = {
    parking:   L.layerGroup().addTo(map),
    hotel:     L.layerGroup().addTo(map),
    transport: L.layerGroup().addTo(map),
    other:     L.layerGroup().addTo(map)
  };

  places.forEach(function (p) {
    const size = p.type === 'venue' ? 34 : 26;
    const icon = L.divIcon({
      className: '',
      html: '<div class="ga-pin ' + p.type + '">' + p.label + '</div>',
      iconSize: [size, size],
      iconAnchor: [size / 2, size / 2]
    });
    const group = groups[p.type] || groups.other;
    L.marker([p.lat, p.lng], { icon: icon, title: p.name })
      .bindPopup(popupHtml(p))
      .addTo(group);
  });

  // Toggle layers on and off
  L.control.layers(null, {
    'Parking': groups.parking,
    'Hotels': groups.hotel,
    'Transportation': groups.transport
  }, { collapsed: false }).addTo(map);

  // Legend
  const legend = L.control({ position: 'bottomleft' });
  legend.onAdd = function () {
    const div = L.DomUtil.create('div', 'ga-legend');
    div.innerHTML =
      '<b>Parking</b> A–F &nbsp; <b>Hotels</b> 1–8<br>' +
      'Tap any pin for details. $–$$$ = relative price.';
    return div;
  };
  legend.addTo(map);

  // Enable scroll-zoom only after the user clicks the map (avoids hijacking page scroll)
  map.on('click', function () { map.scrollWheelZoom.enable(); });
  map.on('mouseout', function () { map.scrollWheelZoom.disable(); });

  if (SHOW_COORDS) {
    map.on('click', function (e) {
      const txt = e.latlng.lat.toFixed(5) + ', ' + e.latlng.lng.toFixed(5);
      L.popup().setLatLng(e.latlng).setContent('lat: ' + txt.replace(', ', '<br>lng: ')).openOn(map);
    });
  }
})();
</script>
